name: math_wake
description: "MathWake — 수학 문제를 풀어야 꺼지는 기상 알람 앱"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 알람 스케줄링 & 알림
  flutter_local_notifications: ^17.2.4
  android_alarm_manager_plus: ^3.0.3
  timezone: ^0.9.4

  # 오디오
  just_audio: ^0.9.40

  # 진동
  vibration: ^2.0.0

  # 화면 켜짐 유지
  wakelock_plus: ^1.2.8

  # 상태관리
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # 로컬 DB
  hive_flutter: ^1.1.0
  hive: ^2.2.3

  # 권한 요청
  permission_handler: ^11.3.1

  # 파일 피커 (커스텀 음원)
  file_picker: ^8.1.2

  # 유틸
  path_provider: ^2.1.3
  uuid: ^4.5.1
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  hive_generator: ^2.0.1

# package_info_plus 9.0.1 및 wakelock_plus 1.4.0이 flutter.compileSdkVersion을 잘못 참조하는 버그가 있어
# AGP 8.12.1 환경에서 빌드 실패함 → 호환되는 버전으로 고정
dependency_overrides:
  package_info_plus: 8.1.3
  package_info_plus_platform_interface: 3.0.0
  wakelock_plus: 1.2.8
  wakelock_plus_platform_interface: 1.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/sounds/
